# __HOST__ -> MCP Registry (Phoenix release on 127.0.0.1:__PORT__)
# Installed once by deploy/deploy.sh. certbot then adds the HTTPS server block,
# so later deploys leave this file alone.

map $http_upgrade $mcp_registry_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LiveView websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcp_registry_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
